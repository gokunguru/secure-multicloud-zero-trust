name: Terraform Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform-security:
    name: Terraform Format, Validate and Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/aws
          quiet: true
          soft_fail: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/aws
          soft_fail: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
        working-directory: .

      - name: Run Gitleaks Secret Scan
        run: ~/go/bin/gitleaks detect --source . --redact --verbose
        working-directory: .